name: Start Playing
description: >-
  StartPlaying (startplaying.games) is the largest online marketplace connecting
  tabletop roleplaying game (TTRPG) players with professional Game Masters for
  systems including Dungeons & Dragons, Pathfinder, Starfinder, Warhammer, and
  many more. Players discover, book, and join online sessions filtered by system,
  platform, genre, playstyle, and GM reviews, while Game Masters build careers by
  hosting paid games across virtual tabletops. The platform also offers gift cards,
  learn-to-play one-shots for beginners, kids' games, and corporate team-building
  events. Surfaced as an a16z portfolio company and added to the API Evangelist
  network; enrichment found a consumer web product with no public developer API.
